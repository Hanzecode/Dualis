[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
; host_key_checking is off deliberately: this VM gets destroyed and recreated
; (terraform destroy / apply) far more often than a real long-lived server
; would, so its host key changes every time — false here is a reasonable
; trade for a disposable demo box, not something to carry into a fleet of
; production servers you're not constantly rebuilding.
