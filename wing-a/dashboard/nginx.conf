server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. Using a variable in proxy_pass below makes nginx
    # look up "wing-a" when a request arrives instead of at startup, so this
    # container starts fine even if wing-a isn't up yet (otherwise nginx exits
    # with "host not found in upstream").
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://wing-a:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
